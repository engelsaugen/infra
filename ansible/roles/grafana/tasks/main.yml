#one off task for grafana, and the whole stack since they will all live in the monitoring ns

- name: Install venv
  apt:
    name: python3-venv
    state: present
  become: true

- name: Create venv
  command: python3 -m venv /opt/ansible-venv
  args:
    creates: /opt/ansible-venv

- name: Install kubernetes in venv
  pip:
    name: kubernetes
    virtualenv: /opt/ansible-venv

- name: Use venv python
  set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python

- name: Ensure pip is installed
  apt:
    name: python3-pip
    state: present
    update_cache: yes
  become: true
  
#need the kubernetes library in python
#need pip for it as apt doesnt have it :)))))
#needs to be in a venv cuz it breaks other things :)))))))))
  
- name: ensure monitoring namespace exists #
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring

#- name: apply kube manifests
#  kubernetes.core.k8s:
#    state: present
#    src: "{{ playbook_dir }}/../../monitoring/grafana/"
#

- name: apply grafana datasource
  kubernetes.core.k8s:
    state: present
    src: "{{ grafana_manifest_dir }}/datasource.yaml"

- name: apply grafana deployment
  kubernetes.core.k8s:
    state: present
    src: "{{ grafana_manifest_dir }}/deployment.yaml"

- name: apply grafana service
  kubernetes.core.k8s:
    state: present
    src: "{{ grafana_manifest_dir }}/service.yaml"
