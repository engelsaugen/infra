- name: update apt cache
# ansible.builtin.package: - swap to anything but apt at your own risk. Here we use apt because we rely on apt-specific flags like update_cache.
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: make sure basic packages are installed
# ansible.builtin.package: - same deal. Example is optimised for Debian so will need a few tweaks for other distributions.
  apt:
    name:
      - curl
      - wget #for curl purposes but diff
      - ca-certificates #need tls
      - gnupg
      - lsb-release #OS info. Not associated with user creation
      - software-properties-common
      - socat #same as iptables. Needed by kube-proxy. Port forwarding and stuff.
      - conntrack #connection trackinng - again kube-proxy
      - iptables #for kubernetes since it relies on iptables binaries
 #    - apt-transport-http - #retro. Uncomment if you're retro
 #    - apt-transport-https - #i.e Debian <10
     state: present
     update_cache: true #second time to be safe
  become: true
  
