#  (longshot) install argo so the app manifest can run

- name: argo namespace
  ansible.builtin.command: kubectl create namespace argocd
  register: ns_result
  failed_when: false
  changed_when: "'created' in ns_result.stdout"

- name: install argo & co
  ansible.builtin.command: >
    kubectl apply -n argocd
    -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

 - name: expose argo via nodeport
  kubernetes.core.k8s:
    state: patched
    kind: Service
    namespace: argocd
    name: argocd-server
    definition:
      spec:
        type: NodePort
  
#- name: expose argo via nodeport #chatgpt alternative
    ansible.builtin.command: >
      kubectl patch svc argocd-server -n argocd \
      -p '{"spec": {"type": "NodePort"}}
    failed_when: false

  


