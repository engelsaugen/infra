- name: pull prometheus container
  containers.podman.podman_image:
    name: docker.io/prom/prometheus
    tag: latest
    state: present

- name: run prometheus
  containers.podman.podman_container:
    name: prometheus
    image: docker.io/prom/prometheus:latest
    state: started
    restart_policy: always
    ports:
      - "9090:9090"
    volumes:
      - /opt/observability/prometheus/data:/prometheus
      - /opt/observability/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml


